version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: devflow_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: devflow_root_password
      MYSQL_DATABASE: devflow_db
      MYSQL_USER: devflow_user
      MYSQL_PASSWORD: devflow_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

volumes:
  mysql_data:
    driver: local
