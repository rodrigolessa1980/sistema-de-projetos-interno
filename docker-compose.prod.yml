name: devflow

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      secrets:
        - backend_env
    container_name: devflow_backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4011:4011"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4011/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - devflow

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: devflow_frontend
    restart: on-failure:5
    mem_limit: 512m
    cpus: 0.75
    environment:
      PORT: 8022
    ports:
      - "8022:8022"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - devflow

secrets:
  backend_env:
    file: ./backend/.env

networks:
  devflow:
    driver: bridge
