# Deploy blue-green (sem proxy). Cada "cor" (blue/green) sobe como um projeto
# Compose separado — o script define o nome do projeto com `-p devflow_${COLOR}`.
#
# Variaveis controladas pelo scripts/deploy-remote.sh:
#   COLOR         -> blue | green (sufixo do container e do projeto)
#   BACKEND_BIND  -> "127.0.0.1:4012" (validacao) ou "4011" (portas reais/cutover)
#   FRONTEND_BIND -> "127.0.0.1:8023" (validacao) ou "8022" (portas reais/cutover)
#
# Os defaults (:-) apontam para as portas reais, entao um `up` manual sem essas
# variaveis se comporta como producao normal.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      secrets:
        - backend_env
    container_name: devflow_backend_${COLOR:-blue}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_BIND:-4011}:4011"
    networks:
      - devflow

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: devflow_frontend_${COLOR:-blue}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    environment:
      PORT: 8022
    ports:
      - "${FRONTEND_BIND:-8022}:8022"
    depends_on:
      backend:
        condition: service_started
    networks:
      - devflow

secrets:
  backend_env:
    file: ./backend/.env

networks:
  devflow:
    driver: bridge
