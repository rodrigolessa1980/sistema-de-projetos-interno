name: devflow

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      secrets:
        - backend_env
    container_name: devflow_backend
    restart: on-failure:5
    mem_limit: 512m
    cpus: 0.75
    env_file:
      - ./backend/.env
    ports:
      - "4011:4011"
    networks:
      - devflow

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: devflow_frontend
    restart: on-failure:5
    mem_limit: 512m
    cpus: 0.75
    environment:
      PORT: 8022
    ports:
      - "8022:8022"
    depends_on:
      - backend
    networks:
      - devflow

secrets:
  backend_env:
    file: ./backend/.env

networks:
  devflow:
    driver: bridge
