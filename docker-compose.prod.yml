name: devflow

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      secrets:
        - backend_env
    container_name: devflow_backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4011:4011"
    networks:
      - devflow

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: devflow_frontend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    environment:
      PORT: 8022
    ports:
      - "8022:8022"
    depends_on:
      backend:
        condition: service_started
    networks:
      - devflow

secrets:
  backend_env:
    file: ./backend/.env

networks:
  devflow:
    driver: bridge
